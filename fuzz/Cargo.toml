[package]
name = "miasma-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the wire and storage decoders (not part of the main workspace)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miasma-fuzz-harness = { path = "harness" }

# A workspace of its own: `cargo build` at the repository root never sees this
# directory, and the nightly-only fuzz build never touches the main lock file.
[workspace]
members = ["harness"]

[profile.release]
debug = 1

[[bin]]
name = "chat_frame"
path = "fuzz_targets/chat_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_state"
path = "fuzz_targets/chat_state.rs"
test = false
doc = false
bench = false

