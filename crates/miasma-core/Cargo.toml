[package]
name = "miasma-core"
description = "Core cryptographic and networking library for the Miasma Protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
blake3.workspace = true
aes-gcm.workspace = true
blahaj.workspace = true
reed-solomon-simd.workspace = true
rand.workspace = true
zeroize.workspace = true
hkdf.workspace = true
sha2.workspace = true
serde.workspace = true
bincode.workspace = true
bs58.workspace = true
hex.workspace = true
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
anyhow.workspace = true
libp2p.workspace = true
futures = "0.3"
async-trait = "0.1"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
rustls-platform-verifier = "0.7.1"
rustls-pemfile.workspace = true
tokio-socks.workspace = true
quinn.workspace = true
rcgen = "0.13"
# Reads the issuer of the relay certificate for the status (relay_tls).
x509-parser = "0.18"
subtle = "2"
# ECDSA P-256 verification of browser session requests (web_session). Already
# in the dependency tree through rustls; this adds no new crate.
ring = "0.17"
argon2.workspace = true
hyper.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
base64.workspace = true
# Self-update: semver ordering of release tags, and reading the release archive.
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip only enables flate2 without a backend; pick the pure Rust one explicitly so
# this crate builds on its own (not only when another crate selects it).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
shadowsocks-crypto.workspace = true
# Direct transport by public key (see src/transport/iroh_direct.rs). ring TLS
# only: no aws-lc/cmake, no portmapper, no metrics. platform-verifier: relay and
# discovery TLS is checked against the OS certificate store (see ca_tls_config).
# unstable-net-report: UDP / NAT-mapping / relay-latency report for `netcheck`
# (the version is pinned by Cargo.lock; revisit on an iroh upgrade).
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "platform-verifier", "unstable-net-report"], optional = true }
# Same-LAN discovery of a publisher by its key (mDNS), no internet needed.
iroh-mdns-address-lookup = { version = "0.6", optional = true }

# Optional post-quantum key exchange (see src/protocol/hybrid.rs). Off by
# default. RustCrypto ML-KEM (FIPS 203); `rand_core` 0.10 is only used to
# adapt the existing OS random source to that crate's RNG traits.
ml-kem = { version = "0.3.3", default-features = false, features = ["zeroize"], optional = true }
rand_core_pqc = { package = "rand_core", version = "0.10", default-features = false, optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"], optional = true }
zune-jpeg = { version = "0.5.15", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Power"] }

# Keep-awake while work is in flight (src/power.rs). Both crates are already in
# Cargo.lock through the desktop GUI stack, so this adds no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[features]
default = ["iroh", "call-video"]
# `miasma daemon --no-iroh` / `transport.iroh_mode = "off"` switch it off at run
# time; building without the feature removes the code and the dependency tree.
iroh = ["dep:iroh", "dep:iroh-mdns-address-lookup"]
call-video = ["dep:jpeg-encoder", "dep:zune-jpeg"]
# Hybrid X25519 + ML-KEM-768 key exchange primitives. Library only; not
# enabled by default and not used by any live handshake.
pqc = ["dep:ml-kem", "dep:rand_core_pqc"]

[dev-dependencies]
# Local relay for the tests: no traffic to any public service.
iroh-relay = { version = "1.3", default-features = false, features = ["test-utils", "server"] }
# The call transport test builds `Bytes` for iroh's datagram API. Already in the
# lock file through iroh; pinned to the same major.
bytes = "1"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
socket2 = "0.6"
# Independent SHA-3 / SHAKE for the ML-KEM known-answer checks (already in the
# lock file through ml-kem).
sha3 = "0.12"
shake = "0.1"

[[bench]]
name = "crypto_bench"
harness = false

# `fuzzing` is set by cargo-fuzz (see the fuzz/ directory).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

