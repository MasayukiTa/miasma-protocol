[package]
name = "miasma-core"
description = "Core cryptographic and networking library for the Miasma Protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
blake3.workspace = true
aes-gcm.workspace = true
blahaj.workspace = true
reed-solomon-simd.workspace = true
rand.workspace = true
zeroize.workspace = true
hkdf.workspace = true
sha2.workspace = true
serde.workspace = true
bincode.workspace = true
bs58.workspace = true
hex.workspace = true
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
anyhow.workspace = true
libp2p.workspace = true
futures = "0.3"
async-trait = "0.1"
serde_json.workspace = true
tracing.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
rustls-platform-verifier = "0.7.1"
rustls-pemfile.workspace = true
tokio-socks.workspace = true
quinn.workspace = true
rcgen = "0.13"
subtle = "2"
argon2.workspace = true
hyper.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
base64.workspace = true
shadowsocks-crypto.workspace = true
# Direct transport by public key (see src/transport/iroh_direct.rs). ring TLS
# only: no aws-lc/cmake, no portmapper, no metrics. platform-verifier: relay and
# discovery TLS is checked against the OS certificate store (see ca_tls_config).
# unstable-net-report: UDP / NAT-mapping / relay-latency report for `netcheck`
# (the version is pinned by Cargo.lock; revisit on an iroh upgrade).
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "platform-verifier", "unstable-net-report"], optional = true }
# Same-LAN discovery of a publisher by its key (mDNS), no internet needed.
iroh-mdns-address-lookup = { version = "0.6", optional = true }

[features]
default = ["iroh"]
# `miasma daemon --no-iroh` / `transport.iroh_mode = "off"` switch it off at run
# time; building without the feature removes the code and the dependency tree.
iroh = ["dep:iroh", "dep:iroh-mdns-address-lookup"]

[dev-dependencies]
# Local relay for the tests: no traffic to any public service.
iroh-relay = { version = "1.3", default-features = false, features = ["test-utils", "server"] }
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "crypto_bench"
harness = false
