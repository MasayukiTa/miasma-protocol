[package]
name = "miasma-cli"
description = "Command-line interface for the Miasma Protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Hybrid upgrade of private conversations, included in release builds (the
# setting `privacy.pqc_mode` defaults to `require`: the hybrid exchange must
# succeed or no message is sent). See docs/pqc-session-upgrade.md.
pqc = ["miasma-core/pqc"]
# Release builds include the hybrid upgrade; `privacy.pqc_mode` defaults to
# `require` (the exchange must succeed) until a person sets `off` or `prefer`.
default = ["pqc"]

[[bin]]
name = "miasma"
path = "src/main.rs"

[dependencies]
miasma-core = { path = "../miasma-core" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
zeroize.workspace = true
toml.workspace = true
libp2p.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
