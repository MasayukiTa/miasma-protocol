[package]
name = "miasma-desktop"
description = "Cross-platform desktop GUI — Phase 3 (Task 22)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Developer-only: walk theme x language x tab and save screenshots (see src/app/tour.rs).
ui-tour = []
# Hybrid upgrade of private conversations, included in release builds (the
# setting `privacy.pqc_mode` defaults to `prefer`). See
# docs/pqc-session-upgrade.md.
pqc = ["miasma-core/pqc"]
# Release builds include the hybrid upgrade; `privacy.pqc_mode` defaults to
# `prefer` (used when the contact supports it) until a person changes it.
default = ["pqc"]

[[bin]]
name = "miasma-desktop"
path = "src/main.rs"

[dependencies]
miasma-core = { path = "../miasma-core" }
tokio       = { version = "1", features = ["full"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
toml.workspace = true
bs58.workspace = true
hex.workspace = true
directories.workspace = true
serde_json.workspace = true

# GUI — egui immediate-mode, cross-platform (Windows/macOS/Linux)
egui   = "0.27"
eframe = { version = "0.27", features = ["default_fonts"] }
rfd    = "0.14"   # native file-picker dialogs
# Share ID QR code: pure Rust, no image or system dependencies.
qrcode = { version = "0.14", default-features = false }
# Reading a QR code from a picture file: pure Rust decoders only (no system libraries).
# `image` is limited to the two formats people photograph or screenshot a code in.
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
rqrr  = { version = "0.11", default-features = false }

# Camera for reading a contact QR code. One maintained crate with only the platform backend that
# is needed (Media Foundation on Windows, AVFoundation on macOS). Its default `decoding` feature
# pulls in a C++ JPEG library, so it is off: camera JPEG frames go through the `image` decoder.
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
rand.workspace = true
# The tree consumer used by the Windows adapter: lets tests apply a tree update the way the platform side does.
accesskit_consumer = "0.16"
