name: call-spike

on:
  workflow_dispatch:
  push:
    branches: [spike/call-stack]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  spike:
    name: spike (${{ matrix.os }}${{ matrix.nocmake && ' nocmake' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.nocmake == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
            nocmake: true
    defaults:
      run:
        working-directory: spikes/call-stack
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Hide cmake (no-cmake variant)
        if: matrix.nocmake == true
        run: |
          for p in $(which -a cmake ninja); do sudo mv "$p" "$p.hidden"; done
          (command -v cmake) && echo "cmake still visible" || echo "cmake hidden"

      - name: Toolchain info
        shell: bash
        run: |
          rustc --version
          cargo --version
          echo "--- cmake:"
          (command -v cmake && cmake --version | head -1) || echo "cmake: NOT FOUND"
          echo "--- ninja:"
          (command -v ninja && ninja --version) || echo "ninja: NOT FOUND"
          echo "--- cc/cl:"
          (command -v cc || command -v cl || command -v gcc || command -v clang) || echo "cc: NOT FOUND"

      - name: Build
        shell: bash
        run: |
          start=$(date +%s); rc=0
          case "$RUNNER_OS" in
            Linux) /usr/bin/time -v cargo build --release 2> build_time.txt || rc=$? ;;
            macOS) /usr/bin/time -l cargo build --release 2> build_time.txt || rc=$? ;;
            *) cargo build --release || rc=$? ;;
          esac
          end=$(date +%s)
          if [ -f build_time.txt ]; then grep -E "Maximum resident|maximum resident" build_time.txt || true; fi
          if [ -f build_time.txt ] && [ "$rc" -ne 0 ]; then tail -80 build_time.txt; fi
          echo "BUILD_SECONDS=$((end-start)) exit=$rc"
          exit $rc

      - name: Run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/time -v ./target/release/call-stack-spike 2> run_time.txt; rc=$?
          grep -E 'Maximum resident|Elapsed' run_time.txt
          echo "run exit=$rc"; exit $rc

      - name: Run (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/time -l ./target/release/call-stack-spike 2> run_time.txt; rc=$?
          grep -E 'maximum resident|real' run_time.txt
          echo "run exit=$rc"; exit $rc

      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/call-stack-spike.exe -NoNewWindow -PassThru
          $peak = 0
          while (-not $p.HasExited) {
            try { $p.Refresh(); if ($p.PeakWorkingSet64 -gt $peak) { $peak = $p.PeakWorkingSet64 } } catch {}
            Start-Sleep -Milliseconds 25
          }
          Write-Host ("PEAK_WORKING_SET_MB_polled=" + [math]::Round($peak / 1MB, 1))
          Write-Host "run exit=$($p.ExitCode)"
          exit $p.ExitCode
