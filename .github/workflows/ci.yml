name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets

  test-core:
    name: Core Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test miasma-core
        run: cargo test -p miasma-core --tests --locked

  test-desktop-windows:
    name: Desktop and CLI Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test desktop
        run: cargo test -p miasma-desktop --locked

      # The bridge's tests were only ever built, never run, so its entire
      # suite (including the cross-process BitTorrent round trip) was
      # invisible to CI. `cargo test` builds the binary too.
      - name: Test bridge
        run: cargo test -p miasma-bridge --locked

      - name: Build CLI
        run: cargo build -p miasma-cli --locked

  test-web-wasm:
    name: Web/WASM Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test wasm crate
        run: cargo test -p miasma-wasm --locked

      - name: Build wasm target
        run: cargo build -p miasma-wasm --target wasm32-unknown-unknown --locked

  build-apple-foundation:
    name: Apple Foundation Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Apple-relevant crates
        run: cargo build -p miasma-core -p miasma-ffi -p miasma-wasm --locked

  cross-compile-arm64:
    name: Cross-compile ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --target aarch64-unknown-linux-gnu -p miasma-core --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # `cargo update` + the libp2p 0.54->0.56 migration (2026-09-04)
        # together resolved 12 of the original 18 advisories -- the libp2p
        # bump alone dropped h2 0.3.x, the old duplicate ring 0.16.20, and
        # two duplicate old rustls-webpki versions from the graph entirely.
        # What's ignored below all need either a further breaking
        # major-version bump of a transitive dependency chain, or have no
        # fixed release at all upstream -- ignored here so CI reflects real,
        # tracked risk instead of being permanently red. (cargo-audit 0.22.2
        # in this workflow does not pick up an audit.toml config file in
        # this repo layout, so these are passed as flags.)
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0118
          --ignore RUSTSEC-2026-0119
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0257
        # RUSTSEC-2026-0118 / -0119 (hickory-proto 0.25.2). Both need
        #   hickory-proto >=0.26.1. It reaches this workspace from exactly
        #   one place -- libp2p-mdns 0.48.0, which pins hickory-proto "0.25"
        #   (`cargo tree -i hickory-proto`; libp2p-request-response does NOT
        #   depend on it, contrary to an earlier note here). libp2p 0.56.0
        #   is the newest release; rust-libp2p master has already moved its
        #   workspace pin to hickory-proto 0.26 for the unreleased
        #   libp2p-mdns 0.49.0, so this clears on the next libp2p release.
        #   Neither advisory is reachable in what this workspace builds --
        #   both facts are checkable, not assumed:
        #     -0118 (NSEC3 closest-encloser validation loop) lives in
        #       hickory-proto's `src/dnssec/`, which `src/lib.rs:55` gates
        #       behind `dnssec-aws-lc-rs` / `dnssec-ring`. `cargo tree -e
        #       features --workspace --all-features` enables only "std",
        #       "mdns", "futures-io" and "socket2" -- the module is not
        #       compiled at all.
        #     -0119 (O(n^2) name compression) is in the message *encoder*.
        #       libp2p-mdns never encodes through hickory: it builds every
        #       outgoing packet by hand in `behaviour/iface/dns.rs`
        #       (`append_u16`/`append_qname` into a Vec<u8>). Its only
        #       non-test use of the crate is `Message::from_vec` at
        #       `behaviour/iface/query.rs:55` -- decoding.
        #   Re-check both claims when libp2p is bumped; the reachability
        #   argument is version-specific, not permanent.
        # RUSTSEC-2026-0194 / -0195 (quick-xml): needs >=0.41.0. Two old
        #   versions (0.37.5, 0.39.2) are both in the graph from different
        #   transitive paths and need identifying + bumping individually.
        # RUSTSEC-2024-0398 (sharks 0.5.0) is no longer ignored: the
        #   dependency was replaced with `blahaj` 0.6, the fixed fork the
        #   advisory itself points at. See docs/adr/011-sss-crate-swap.md.
        # RUSTSEC-2026-0257 (webbrowser): needs >=1.2.2. Transitive via the
        #   CLI's browser-launch helper; low severity, straightforward once
        #   touched together with its dependents' version requirements.
        #
        # NOT ignored, and deliberately not tracked here: yamux 0.12.1
        # (GHSA-vxx9-2994-q338 / CVE-2026-32314, remote panic) is present in
        # the lockfile via libp2p-yamux's own unconditional dependency on
        # BOTH yamux 0.12 and 0.13 (verified in libp2p-yamux 0.47.0's
        # Cargo.toml -- there is no feature flag to drop either side), but
        # this project only ever constructs `yamux::Config::default()`
        # (crates/miasma-core/src/network/node.rs), which resolves to
        # `Either::Right(Config013)` -- the fixed yamux013 path. The
        # vulnerable yamux012 code is compiled in but never instantiated at
        # runtime. cargo-audit's local RustSec DB does not flag this ID at
        # all yet, so it never reached this ignore list; see the P1-6 note
        # in docs/tasks/remaining-tasks-prioritized.md for the full
        # reachability analysis and why the corresponding Dependabot alert
        # was dismissed with a tolerable_risk rationale rather than fixed.

  coverage:
    name: Core Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage report
        run: cargo llvm-cov -p miasma-core --tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: lcov.info
