name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets

  test-core:
    name: Core Tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test miasma-core
        run: cargo test -p miasma-core --tests --locked

  test-core-pqc:
    name: Core Tests, opt-in hybrid feature (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # The feature is off by default, so the job above never builds it.
      - name: Test the hybrid upgrade (chat and protocol modules)
        run: |
          cargo test -p miasma-core --features pqc --locked --lib -- chat:: protocol::

      - name: Test old-peer compatibility, frozen wire bytes, local-relay chat
        run: >
          cargo test -p miasma-core --features pqc --locked
          --test pqc_old_peer_compat_test --test chat_pqc_net_test
          --test wire_compat_test --test wire_compat_net_test --test wire_compat_group_test
          --test persisted_paths_lint

      - name: Check the mobile bridge with the feature
        run: cargo check -p miasma-ffi --features pqc --locked

  test-desktop-windows:
    name: Desktop and CLI Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test desktop
        run: cargo test -p miasma-desktop --locked

      # The desktop and CLI programs include the hybrid upgrade by default;
      # this is the build without it (Settings shows the choices switched off).
      - name: Test desktop and check CLI without the hybrid feature
        run: |
          cargo test -p miasma-desktop --no-default-features --locked --bin miasma-desktop -- the_chat_protection_radios
          cargo check -p miasma-cli --no-default-features --locked

      # The bridge's tests were only ever built, never run, so its entire
      # suite (including the cross-process BitTorrent round trip) was
      # invisible to CI. `cargo test` builds the binary too.
      - name: Test bridge
        run: cargo test -p miasma-bridge --locked

      # The daemon control token is created owner-only and verified; these
      # run the Windows access-list code for real.
      - name: Test control token file protection
        run: |
          cargo test -p miasma-core --lib --locked -- secure_file:: control_auth::
          cargo test -p miasma-core --locked --test adversarial_ipc_test -- token_file daemon_does_not_start

      # The root key wrap that uses the Windows data protection API.
      - name: Test root key wrap
        run: cargo test -p miasma-core --lib --locked -- "root_key::"

      - name: Build CLI
        run: cargo build -p miasma-cli --locked

  test-web-wasm:
    name: Web/WASM Tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test wasm crate
        run: cargo test -p miasma-wasm --locked

      # Design tokens (contrast, palette) and the client's pure functions.
      - name: Web client JS tests (node, no dependencies)
        run: node --test web/tests/*.test.mjs

      # Fails when a shipped web file differs from web/asset-manifest.json.
      - name: Web asset manifest is up to date
        run: node scripts/web-asset-manifest.mjs --check

      - name: Build wasm target
        run: cargo build -p miasma-wasm --target wasm32-unknown-unknown --locked

      # web/pkg is a committed build product. Fail when the source or the
      # locked dependencies moved without a rebuilt package, then rebuild it
      # here and compare what does not depend on the build machine (the .wasm
      # bytes embed absolute build paths; see scripts/check-wasm-pkg.mjs).
      - name: Package record matches the source
        run: node scripts/check-wasm-pkg.mjs --check

      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo-wbg
          key: wasm-bindgen-cli-${{ steps.wbg.outputs.version }}-ubuntu-24.04

      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wbg.outputs.version }}" --locked --root ~/.cargo-wbg

      - name: Rebuild the package from source and compare with web/pkg
        run: |
          export PATH="$HOME/.cargo-wbg/bin:$PATH"
          bash scripts/build-wasm-pkg.sh "$RUNNER_TEMP/pkg-rebuilt"
          node scripts/check-wasm-pkg.mjs --compare "$RUNNER_TEMP/pkg-rebuilt"

  # Offline release signing tool: its own workspace, never part of the apps.
  test-release-sign:
    name: Release signing tool tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/release-sign

      - name: Build and test the signing tool
        run: cargo test --manifest-path tools/release-sign/Cargo.toml --locked

  build-apple-foundation:
    name: Apple Foundation Build (macOS)
    # id-token and attestations are needed only for the provenance step, which
    # runs on pushes to main; they are not granted to any other job.
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Apple-relevant crates
        run: cargo build -p miasma-core -p miasma-ffi -p miasma-wasm --locked

      - name: Test macOS desktop and bridge
        run: cargo test -p miasma-desktop -p miasma-bridge --locked

      - name: Package macOS desktop and CLI
        run: bash scripts/build-macos.sh

      - name: Test macOS peer-to-peer loopback
        run: bash scripts/smoke-loopback.sh

      - name: Archive macOS app
        run: ditto -c -k --keepParent dist/Miasma.app dist/Miasma-macOS.zip

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: Miasma-macOS
          path: dist/Miasma-macOS.zip

      # Build provenance for the archive (who built it, from which commit).
      # Pushes to main only: pull requests build exactly as before.
      - name: Attest build provenance (macOS archive)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Miasma-macOS.zip

  macos-cli-transfer:
    name: CLI + desktop build and transfer e2e (macOS)
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # Release build: the same binaries that are handed to a person who has no
      # Rust toolchain (see the artifact step below). Both packages include the
      # hybrid upgrade by their default features.
      - name: Build CLI and desktop (release)
        run: cargo build --release -p miasma-cli -p miasma-desktop --locked

      # Real binary, two loopback nodes, a daemon killed mid-transfer on each
      # side. The same script the macOS sender runs before a cross-machine test.
      - name: Transfer end-to-end (protected, resumable)
        run: scripts/transfer-e2e.sh --cli target/release/miasma

      # Zip artifacts lose the executable bit, so ship a tar.gz inside it.
      # The binaries are unsigned: on the receiving Mac, remove the quarantine
      # flag once: xattr -dr com.apple.quarantine <file>.
      - name: Package macOS binaries
        run: |
          mkdir -p dist/miasma-macos
          cp target/release/miasma target/release/miasma-desktop dist/miasma-macos/
          cp scripts/transfer-e2e.sh dist/miasma-macos/
          tar -czf dist/miasma-macos.tar.gz -C dist miasma-macos
          shasum -a 256 dist/miasma-macos.tar.gz

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: miasma-macos-arm64
          path: dist/miasma-macos.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Attest build provenance (macOS binaries)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/miasma-macos.tar.gz

  # The released command-line program must stop, and leave the data directory
  # alone, when master.key is not a plain 32-byte key (see
  # crates/miasma-core/tests/root_key_downgrade_compat.rs for the copied readers).
  older-release-key-file:
    name: Released CLI against a 64-byte key file (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the released CLI against the data directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-older-release-key-file.sh v0.3.2-beta.11

  cross-compile-arm64:
    name: Cross-compile ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --target aarch64-unknown-linux-gnu -p miasma-core --locked

      - name: Build the opt-in hybrid feature and its tests for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo test --no-run --target aarch64-unknown-linux-gnu -p miasma-core --features pqc --lib --locked

  test-core-pqc-arm64:
    name: Core Tests, opt-in hybrid feature (native ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test the hybrid key exchange and conversation upgrade
        run: |
          cargo test -p miasma-core --features pqc --locked --lib -- protocol:: chat::pq

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # `cargo update` + the libp2p 0.54->0.56 migration (2026-09-04)
        # together resolved 12 of the original 18 advisories -- the libp2p
        # bump alone dropped h2 0.3.x, the old duplicate ring 0.16.20, and
        # two duplicate old rustls-webpki versions from the graph entirely.
        # What's ignored below all need either a further breaking
        # major-version bump of a transitive dependency chain, or have no
        # fixed release at all upstream -- ignored here so CI reflects real,
        # tracked risk instead of being permanently red. (cargo-audit 0.22.2
        # in this workflow does not pick up an audit.toml config file in
        # this repo layout, so these are passed as flags.)
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0257
          --ignore RUSTSEC-2026-0293
        # RUSTSEC-2026-0118 / -0119 are no longer ignored: libp2p 0.57.0
        #   pulls libp2p-mdns 0.49.0 and hickory-proto 0.26.3, beyond the
        #   vulnerable 0.25.x line.
        # RUSTSEC-2026-0194 / -0195 (quick-xml) are no longer ignored:
        #   librqbit 9.0.1 collapses the graph to quick-xml 0.41.0 only.
        # RUSTSEC-2024-0398 (sharks 0.5.0) is no longer ignored: the
        #   dependency was replaced with `blahaj` 0.6, the fixed fork the
        #   advisory itself points at. See docs/adr/011-sss-crate-swap.md.
        # RUSTSEC-2026-0257 (webbrowser): needs >=1.2.2. Transitive via the
        #   CLI's browser-launch helper; low severity, straightforward once
        #   touched together with its dependents' version requirements.
        # RUSTSEC-2026-0293 (ringbuf <0.5.2): librqbit 9.0.1 unconditionally
        #   pulls librqbit-utp 0.7.0, which pins ringbuf ^0.4.7. The advisory
        #   requires an element's Drop implementation to panic while
        #   Consumer::skip/clear is dropping elements. librqbit-utp's ring
        #   buffer is SharedRb<Heap<u8>>, so its elements are u8 and have no
        #   Drop implementation; the exploit precondition is unreachable in
        #   this dependency path. Upstream librqbit-utp main still pins 0.4.7
        #   as of 2026-09-29. Remove this ignore when upstream moves to >=0.5.2.

  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      # Policy and the dated advisory exceptions live in deny.toml.
      - name: Run cargo deny
        run: cargo deny --locked check advisories sources licenses bans

  coverage:
    name: Core Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage report
        run: cargo llvm-cov -p miasma-core --tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: lcov.info
