name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets

  test-core:
    name: Core Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test miasma-core
        run: cargo test -p miasma-core --tests --locked

  test-desktop-windows:
    name: Desktop and CLI Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test desktop
        run: cargo test -p miasma-desktop --locked

      - name: Build CLI and bridge
        run: cargo build -p miasma-cli -p miasma-bridge --locked

  test-web-wasm:
    name: Web/WASM Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test wasm crate
        run: cargo test -p miasma-wasm --locked

      - name: Build wasm target
        run: cargo build -p miasma-wasm --target wasm32-unknown-unknown --locked

  build-apple-foundation:
    name: Apple Foundation Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Apple-relevant crates
        run: cargo build -p miasma-core -p miasma-ffi -p miasma-wasm --locked

  cross-compile-arm64:
    name: Cross-compile ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --target aarch64-unknown-linux-gnu -p miasma-core --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # `cargo update` (2026-09-04) already resolved every advisory a
        # semver-compatible bump could fix. What's ignored below all need
        # either a breaking major-version bump of a transitive dependency
        # chain, or have no fixed release at all upstream -- ignored here so
        # CI reflects real, tracked risk instead of being permanently red.
        # (cargo-audit 0.22.2 in this workflow does not pick up an audit.toml
        # config file in this repo layout, so these are passed as flags.)
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0119
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2025-0009
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2024-0398
          --ignore RUSTSEC-2026-0257
        # RUSTSEC-2026-0258 (h2): needs h2 >=0.4.16, pulled in transitively
        #   via reqwest/hyper -- a hyper 1.x migration, not a standalone bump.
        # RUSTSEC-2026-0119 (hickory-proto): needs >=0.26.1 (currently
        #   0.24.4), pulled in via libp2p-mdns/libp2p-request-response -- a
        #   libp2p major-version bump.
        # RUSTSEC-2026-0194 / -0195 (quick-xml): needs >=0.41.0. Two old
        #   versions (0.37.5, 0.39.2) are both in the graph from different
        #   transitive paths and need identifying + bumping individually.
        # RUSTSEC-2025-0009 (ring 0.16.20): needs >=0.17.12. Pulled in by an
        #   older rustls/webpki generation alongside a newer one -- same root
        #   cause as the rustls-webpki entries below.
        # RUSTSEC-2026-0098 / -0099 / -0104 (rustls-webpki): needs
        #   >=0.103.12/13. Two old versions (0.101.7, 0.103.9) are both in
        #   the graph (rustls-platform-verifier vs. the libp2p/quinn TLS
        #   stack) and need each path's rustls stack bumped separately.
        # RUSTSEC-2024-0398 (sharks 0.5.0, "Bias of Polynomial Coefficients
        #   in Secret Sharing"): no fixed release exists upstream. sharks
        #   implements the Shamir's Secret Sharing scheme this project's
        #   whole content-dissolution model is built on (see
        #   Research-backed_Master_Design_Doc.md section 2) -- NOT a routine
        #   ignore. Needs its own evaluation of whether the described
        #   coefficient bias is exploitable in how this project uses sharks
        #   (share generation only, never raw polynomial reconstruction
        #   exposed to an adversary) before being accepted long-term, or a
        #   switch to a different SSS crate (vsss-rs is already named as an
        #   alternative for verifiable shares in the design doc).
        # RUSTSEC-2026-0257 (webbrowser): needs >=1.2.2. Transitive via the
        #   CLI's browser-launch helper; low severity, straightforward once
        #   touched together with its dependents' version requirements.

  coverage:
    name: Core Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage report
        run: cargo llvm-cov -p miasma-core --tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: lcov.info
