[package]
name = "call-stack-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the repository workspace.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
cpal = "=0.18.2"
opus = "=0.4.0"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "platform-verifier"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
